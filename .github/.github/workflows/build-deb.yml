name: Build .deb packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint and smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck gcc make
      - name: Make scripts executable
        run: chmod +x prx packaging/build-deb.sh tests/smoke.sh examples/debian
      - name: make check
        run: make check

  check-arm64:
    # pemu_x64 (the JIT in particular) has so far only been tested through the AArch64-interpreter harness on x86_64.
    # This job runs the same checks on a real aarch64 machine. It is informational for now (does not block the build).
    name: make check on aarch64
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make gcc-x86-64-linux-gnu python3
      - name: Make scripts executable
        run: chmod +x prx packaging/build-deb.sh tests/smoke.sh examples/debian
      - name: make check
        env:
          PEMU_X64_CC: x86_64-linux-gnu-gcc
        run: make check

  build:
    name: Build ${{ matrix.target }} package
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [debian, termux]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p dist
          bash packaging/build-deb.sh "${{ matrix.target }}" dist
      - name: Show package info
        run: |
          for f in dist/*.deb; do
            echo "== $f"
            dpkg-deb -I "$f"
            dpkg-deb -c "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: prx-${{ matrix.target }}-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches PRX_VERSION
        run: |
          ver="$(sed -n 's/^PRX_VERSION=//p' prx)"
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match PRX_VERSION=$ver" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.deb > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS --title "prx ${GITHUB_REF_NAME#v}" --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS --clobber
